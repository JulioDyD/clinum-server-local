<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pantalla de sala · Clinum</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    .location-screen {
      position: absolute; left: 50%; top: 50%;
      display: flex; flex-direction: column;
      background-color: var(--bg-color, #0f172a); color: var(--text-color, #ffffff);
      font-family: Arial, sans-serif; overflow: hidden;
      will-change: transform;
    }
    .header-row {
      display: flex; background-color: var(--bg-color, #0f172a); color: var(--header-color, #f59e0b);
      font-size: 2.5rem; font-weight: bold; padding: 10px 20px; border-bottom: 2px solid var(--header-color, #f59e0b);
    }
    .header-row, .footer { flex-shrink: 0; }
    .header-col.llamando { flex: 1 1 auto; }
    .header-col.llam { flex: 0 0 140px; text-align: center; }
    .header-col.tiempo { flex: 0 0 220px; text-align: right; }

    .calls-container { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0.6rem 0; }
    .call-row {
      display: flex; align-items: center; padding: 15px 20px; margin: 0 1.2rem 0.4rem; border-radius: 6px;
      font-size: 2.2rem; gap: 1rem; background: rgba(30,41,59,0.85);
      border-left: 4px solid var(--normal-call-color, #22c55e);
      transition: background-color 0.3s ease;
    }
    .call-row.emergency-call { background: rgba(239,68,68,0.18); border-left: 6px solid var(--emergency-call-color, #ef4444); box-shadow: 0 0 20px rgba(239,68,68,0.6); }
    .call-row.active-call { animation: pulseRow 2s ease-in-out infinite; }
    .call-row.new-call { animation: highlightRow 1s ease-in-out infinite; border-left-color: #f59e0b !important; }
    @keyframes pulseRow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012); } }
    @keyframes highlightRow { 0%, 100% { background-color: rgba(245,158,11,0.3); } 50% { background-color: rgba(245,158,11,0.1); } }

    .call-col.llamando { flex: 1 1 auto; display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
    .call-col.llam { flex: 0 0 140px; text-align: center; font-weight: 700; }
    .call-col.tiempo { flex: 0 0 220px; text-align: right; font-family: 'Courier New', monospace; font-weight: 800; color: var(--timer-color, #22c55e); }
    .call-col.tiempo.emergency-time { color: var(--emergency-call-color, #ef4444); }

    .bed-icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; margin-right: 15px; color: var(--normal-call-color, #22c55e); }
    .bed-icon svg { width: 100%; height: 100%; }
    .call-row.emergency-call .bed-icon { color: var(--emergency-call-color, #ef4444); filter: drop-shadow(0 0 6px rgba(239,68,68,0.7)); }
    .call-text { display: inline-flex; align-items: center; white-space: nowrap; flex-wrap: nowrap; min-width: 0; overflow: hidden; }
    .call-base { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .patient-gap { display: inline-block; white-space: pre; flex-shrink: 0; }
    .patient-icon { display: inline-flex; align-items: center; flex-shrink: 0; width: 44px; height: 44px; margin-right: 10px; }
    .patient-icon svg { width: 100%; height: 100%; }
    .patient-name { white-space: nowrap; flex-shrink: 0; }
    .call-row .call-text { color: var(--text-color, #ffffff); }

    .call-animation-enter-active { transition: all 0.8s ease-out; }
    .call-animation-leave-active { transition: all 0.6s ease-in; position: absolute; }
    .call-animation-enter-from { opacity: 0; transform: translateX(30px) scale(0.95); }
    .call-animation-leave-to { opacity: 0; transform: translateX(-30px) scale(0.95); }
    .call-animation-move { transition: transform 0.8s ease; }

    .no-calls-message { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: #64748b; text-align: center; }
    .no-calls-message .big-icon { font-size: 5rem; }
    .no-calls-message .big-icon svg { width: 5rem; height: 5rem; display: block; }
    .no-calls-message h2 { font-weight: 600; font-size: 2rem; margin: 20px 0 0; color: var(--header-color, #f59e0b); }

    .footer {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 22px;
      border-top: 1px solid var(--header-color, #f59e0b); font-size: 1.2rem; color: #94a3b8;
      background-color: rgba(26,26,26,0.9); margin-top: auto;
    }
    .location-info { flex: 1 1 auto; min-width: 0; font-weight: bold; color: var(--header-color, #f59e0b); font-size: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .last-updated { flex: 0 0 auto; white-space: nowrap; font-family: 'Courier New', monospace; font-weight: 700; color: var(--header-color, #f59e0b); font-size: 1.4rem; }
  </style>
</head>
<body>
<div id="app">
  <div class="location-screen" :style="[cssVariables, screenTransform]">
    <div class="header-row">
      <div class="header-col llamando">LLAMANDO DESDE</div>
      <div class="header-col llam">LLAM</div>
      <div class="header-col tiempo">TIEMPO</div>
    </div>

    <div class="calls-container">
      <template v-if="visibleCalls.length > 0">
        <transition-group name="call-animation">
          <div
            v-for="call in visibleCalls"
            :key="call.deviceId"
            class="call-row active-call"
            :class="{ 'emergency-call': call.isEmergency, 'new-call': newCallIds.includes(call.deviceId) }"
          >
            <div class="call-col llamando">
              <span class="bed-icon" v-html="locationIconSvg(call.locationType)">
              </span>
              <span class="call-text"><span class="call-base">{{ call.name }}</span><template v-if="call.patientName"><span class="patient-gap" aria-hidden="true">&nbsp;&nbsp;&nbsp;</span><span class="patient-icon" title="Paciente asignado" v-html="accountSvg"></span><span class="patient-name">{{ call.patientName }}</span></template></span>
            </div>
            <div class="call-col llam">{{ call.cons || 1 }}</div>
            <div class="call-col tiempo" :class="{ 'emergency-time': call.isEmergency }">{{ formatCallTime(call) }}</div>
          </div>
        </transition-group>
      </template>
      <div v-else class="no-calls-message">
        <div class="big-icon"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#f59e0b"/><path d="M20 33l8 8 16-17" stroke="#111111" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2>No hay llamados activos</h2>
      </div>
    </div>

    <div class="footer">
      <div class="location-info">
        {{ settings.name || 'Sede sin nombre' }}
        <span v-if="allCalls.length > maxVisibleCalls"> — Mostrando {{ visibleCalls.length }} de {{ allCalls.length }}</span>
      </div>
      <div class="last-updated">{{ formattedCurrentTime }}</div>
    </div>

    <audio ref="alertSound" preload="auto"></audio>
    <audio ref="alertSoundBackup1" preload="auto"></audio>
    <audio ref="alertSoundBackup2" preload="auto"></audio>
    <audio ref="emergencySound" preload="auto"></audio>
    <audio ref="emergencySoundBackup1" preload="auto"></audio>
    <audio ref="emergencySoundBackup2" preload="auto"></audio>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue;

createApp({
  setup() {
    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const BASE_VISIBLE_CALLS = 7;
    const ROTATION_INTERVAL_MS = 10000;
    const viewport = reactive({ w: window.innerWidth, h: window.innerHeight });
    const updateViewport = () => {
      viewport.w = window.innerWidth;
      viewport.h = window.innerHeight;
    };

    const calls = ref([]); // ActiveCallState[] tal cual llega del servidor
    const devices = ref([]);
    const settings = ref({
      name: '', pendingReminderEnabled: false, pendingReminderIntervalS: 120, uiScalePercent: 100, backgroundColor: '#0f172a', headerColor: '#f59e0b', textColor: '#ffffff',
      normalCallColor: '#22c55e', emergencyCallColor: '#ef4444', timerColor: '#22c55e',
      soundEnabled: true, soundVolume: 80, alertSound: 'clinum_normal.mp3', emergencySound: 'clinum_emergency.mp3',
      voiceEnabled: true, voiceRate: 1.0, voicePitch: 1.0, voiceVolume: 0.9,
    });

    const currentTime = ref(new Date());
    const callTimers = reactive({});
    const newCallIds = ref([]);
    const rotationIndex = ref(0);

    const alertSound = ref(null);
    const alertSoundBackup1 = ref(null);
    const alertSoundBackup2 = ref(null);
    const emergencySound = ref(null);
    const emergencySoundBackup1 = ref(null);
    const emergencySoundBackup2 = ref(null);
    const nextAudioIndex = ref(0);

    const isSpeaking = ref(false);
    const speechQueue = ref([]);
    const MAX_SPEECH_QUEUE = 5;
    const SPEECH_WATCHDOG_MS = 12000;
    let speechAdvanceTimer = null;
    let speechWatchdogTimer = null;
    let cachedVoices = [];

    const loadVoices = () => {
      if (!('speechSynthesis' in window)) return;
      cachedVoices = window.speechSynthesis.getVoices() || [];
    };
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.addEventListener?.('voiceschanged', loadVoices);
    }
    const pickSpanishVoice = () => {
      if (!cachedVoices.length) loadVoices();
      const latinoCodes = ['es-MX', 'es-US', 'es-AR', 'es-CO', 'es-CL', 'es-PE', 'es-VE', 'es-EC'];
      return cachedVoices.find(v => latinoCodes.some(code => v.lang.startsWith(code)))
        || cachedVoices.find(v => v.lang.startsWith('es')) || null;
    };

    // Recuerda cons por deviceId para detectar insistencias entre snapshots
    const knownCons = new Map();
    let hasLoadedInitialSnapshot = false;

    const cssVariables = computed(() => ({
      '--bg-color': settings.value.backgroundColor,
      '--header-color': settings.value.headerColor,
      '--text-color': settings.value.textColor,
      '--normal-call-color': settings.value.normalCallColor,
      '--emergency-call-color': settings.value.emergencyCallColor,
      '--timer-color': settings.value.timerColor,
    }));

    const screenScale = computed(() => {
      const pct = Number(settings.value.uiScalePercent) || 100;
      return Math.max(50, Math.min(200, pct)) / 100;
    });
    const fitScale = computed(() =>
      Math.min(viewport.w / BASE_WIDTH, viewport.h / BASE_HEIGHT)
    );
    const screenTransform = computed(() => ({
      width: `${BASE_WIDTH / screenScale.value}px`,
      height: `${BASE_HEIGHT / screenScale.value}px`,
      transform: `translate(-50%, -50%) scale(${fitScale.value * screenScale.value})`,
      transformOrigin: 'center center',
    }));
    const maxVisibleCalls = computed(() => {
      const layoutHeight = BASE_HEIGHT / screenScale.value;
      const capacity = Math.floor((layoutHeight - 126) / 72);
      return Math.max(1, Math.min(BASE_VISIBLE_CALLS, capacity));
    });

    const getDeviceName = (deviceId) => {
      const d = devices.value.find(x => x.deviceId === deviceId);
      return d?.name || `Llamador ${deviceId.slice(-6)}`;
    };

    const getDeviceLocationType = (deviceId) => {
      const d = devices.value.find(x => x.deviceId === deviceId);
      return d?.callerLocationType || 'cama';
    };

    // Mismos iconos que el server web de referencia (Iconify, vendorizados sin CDN):
    // cama = mdi:bed, sillon = material-symbols:airline-seat-recline-extra,
    // bano = healthicons:letrina-alt (espejado como en la referencia).
    const LOCATION_ICONS = {
      cama: { viewBox: '0 0 24 24', body: '<path fill="currentColor" d="M19 7h-8v7H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4M7 13a3 3 0 0 0 3-3a3 3 0 0 0-3-3a3 3 0 0 0-3 3a3 3 0 0 0 3 3"/>' },
      sillon: { viewBox: '0 0 24 24', body: '<path fill="currentColor" d="M8.5 6q-.825 0-1.412-.587T6.5 4t.588-1.412T8.5 2t1.413.588T10.5 4t-.587 1.413T8.5 6M14 20H7.55q-.825 0-1.512-.587T5.175 18L3 7h2.05l2.2 11H14zm5.5 2l-2.9-5H9.65q-.725 0-1.263-.437T7.7 15.4l-1.1-5.35q-.275-1.2.563-2.125T9.2 7q.875 0 1.588.525T11.7 8.95L12.8 14h3.25q.525 0 .975.275t.725.725l3.5 6z"/>' },
      bano: { viewBox: '0 0 48 48', body: '<g fill="currentColor"><path d="M6 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2H6zm6 20v-3H6V12h12v11h24c0 8.43-5.703 13.35-13 13.94V37h-5.5v2H29v3H14.5V30c-.747 0-2.5-.5-2.5-2"/><path d="M20 20a1 1 0 0 1 1-1h20a1 1 0 1 1 0 2H21a1 1 0 0 1-1-1"/></g>' },
    };
    const locationIconSvg = (locationType) => {
      const icon = LOCATION_ICONS[locationType] || LOCATION_ICONS.cama;
      return `<svg viewBox="${icon.viewBox}" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${icon.body}</svg>`;
    };

    // Icono de paciente igual que la referencia (mdi:account).
    const accountSvg = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M12 4a4 4 0 0 1 4 4a4 4 0 0 1-4 4a4 4 0 0 1-4-4a4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4"/></svg>`;

    const SPECIAL_CALL_TYPES = ['type3', 'type4', 'type5', 'type6'];

    const allCalls = computed(() => {
      return [...calls.value]
        .filter(c => c.active && !SPECIAL_CALL_TYPES.includes(c.call_type))
        .map(c => {
          const locationType = getDeviceLocationType(c.deviceId);
          return {
            ...c,
            isEmergency: c.call_type === 'emergency',
            name: getDeviceName(c.deviceId),
            locationType,
          };
        })
        .sort((a, b) => {
          if (a.isEmergency && !b.isEmergency) return -1;
          if (!a.isEmergency && b.isEmergency) return 1;
          return a.startedAtMs - b.startedAtMs;
        });
    });

    const visibleCalls = computed(() => {
      const total = allCalls.value.length;
      const limit = maxVisibleCalls.value;
      if (total <= limit) return allCalls.value;
      const start = rotationIndex.value % total;
      const end = start + limit;
      if (end <= total) return allCalls.value.slice(start, end);
      return [...allCalls.value.slice(start), ...allCalls.value.slice(0, end - total)];
    });

    const formattedCurrentTime = computed(() => new Intl.DateTimeFormat('es-CO', {
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'America/Bogota',
    }).format(currentTime.value));

    const formatCallTime = (call) => {
      if (callTimers[call.deviceId]) return callTimers[call.deviceId];
      const diffMs = Date.now() - call.startedAtMs;
      return msToClock(diffMs);
    };

    const msToClock = (diffMs) => {
      const h = Math.floor(diffMs / 3600000);
      const m = Math.floor((diffMs % 3600000) / 60000);
      const s = Math.floor((diffMs % 60000) / 1000);
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

    // ── Audio ──
    const appliedAudio = { normal: '', emergency: '', volume: -1 };
    const clampVolume = (value, fallback) => {
      const n = Number(value);
      return Math.max(0, Math.min(1, Number.isFinite(n) ? n : fallback));
    };
    const setAudioSrc = (el, src) => {
      if (el.getAttribute('src') !== src) el.src = src;
    };
    const applyAudioSources = () => {
      const normalSrc = `/sounds/${settings.value.alertSound || 'clinum_normal.mp3'}`;
      const emergencySrc = `/sounds/${settings.value.emergencySound || 'clinum_emergency.mp3'}`;
      const vol = clampVolume(Number(settings.value.soundVolume ?? 80) / 100, 0.8);
      if (appliedAudio.normal !== normalSrc || appliedAudio.volume !== vol) {
        [alertSound, alertSoundBackup1, alertSoundBackup2].forEach(a => {
          if (!a.value) return;
          setAudioSrc(a.value, normalSrc);
          a.value.volume = vol;
        });
        appliedAudio.normal = normalSrc;
      }
      if (appliedAudio.emergency !== emergencySrc || appliedAudio.volume !== vol) {
        [emergencySound, emergencySoundBackup1, emergencySoundBackup2].forEach(a => {
          if (!a.value) return;
          setAudioSrc(a.value, emergencySrc);
          a.value.volume = vol;
        });
        appliedAudio.emergency = emergencySrc;
      }
      appliedAudio.volume = vol;
    };

    const getNextAudioElement = (isEmergency) => {
      const refs = isEmergency
        ? [emergencySound, emergencySoundBackup1, emergencySoundBackup2]
        : [alertSound, alertSoundBackup1, alertSoundBackup2];
      const el = refs[nextAudioIndex.value % 3].value;
      nextAudioIndex.value = (nextAudioIndex.value + 1) % 3;
      return el;
    };

    // Reproductor de respaldo reutilizable: mantiene el volumen configurado
    // (antes creaba un Audio nuevo a volumen 1.0 en cada fallo).
    const fallbackPlayers = { normal: null, emergency: null };
    const playFallbackSound = (isEmergency, volume) => {
      const key = isEmergency ? 'emergency' : 'normal';
      const file = isEmergency
        ? (settings.value.emergencySound || 'clinum_emergency.mp3')
        : (settings.value.alertSound || 'clinum_normal.mp3');
      let player = fallbackPlayers[key];
      if (!player) { player = new Audio(); fallbackPlayers[key] = player; }
      setAudioSrc(player, `/sounds/${file}`);
      player.volume = volume;
      try { player.currentTime = 0; } catch {}
      player.play().catch(() => {});
    };

    const playAlertSound = (isEmergency) => {
      if (!settings.value.soundEnabled) return;
      const vol = clampVolume(Number(settings.value.soundVolume ?? 80) / 100, 0.8);
      try {
        const el = getNextAudioElement(isEmergency);
        if (!el) return;
        el.muted = false;
        el.volume = vol;
        try { el.currentTime = 0; } catch {}
        el.play().catch(() => playFallbackSound(isEmergency, vol));
      } catch (e) { playFallbackSound(isEmergency, vol); }
    };

    // ── Voz ──
    const clearSpeechTimers = () => {
      if (speechAdvanceTimer) { clearTimeout(speechAdvanceTimer); speechAdvanceTimer = null; }
      if (speechWatchdogTimer) { clearTimeout(speechWatchdogTimer); speechWatchdogTimer = null; }
    };
    const finishSpeech = () => {
      if (speechWatchdogTimer) { clearTimeout(speechWatchdogTimer); speechWatchdogTimer = null; }
      isSpeaking.value = false;
      if (speechAdvanceTimer) clearTimeout(speechAdvanceTimer);
      speechAdvanceTimer = setTimeout(processSpeechQueue, 350);
    };
    const cancelSpeech = () => {
      speechQueue.value = [];
      clearSpeechTimers();
      isSpeaking.value = false;
      try { window.speechSynthesis.cancel(); } catch {}
    };
    const enqueueSpeech = (item) => {
      if (item.pendingReminder) {
        // Un solo recordatorio en cola: no acumular avisos repetidos.
        if (speechQueue.value.some(x => x.pendingReminder)) return;
      } else if (item.deviceId) {
        // Si el mismo llamador vuelve a insistir, reemplaza el anuncio viejo.
        const duplicate = speechQueue.value.findIndex(x => x.deviceId === item.deviceId);
        if (duplicate >= 0) speechQueue.value.splice(duplicate, 1);
      }
      speechQueue.value.push(item);
      while (speechQueue.value.length > MAX_SPEECH_QUEUE) {
        const idx = speechQueue.value.findIndex(x => !x.pendingReminder);
        if (idx < 0) break;
        speechQueue.value.splice(idx, 1);
      }
      processSpeechQueue();
    };
    const processSpeechQueue = () => {
      if (isSpeaking.value || speechQueue.value.length === 0) return;
      if (!('speechSynthesis' in window)) { speechQueue.value = []; return; }
      const item = speechQueue.value.shift();
      const message = item.pendingReminder
        ? 'hay llamados pendientes por finalizar'
        : (item.isEmergency ? `Llamado de emergencia desde ${item.callerName}` : `Llamado desde ${item.callerName}`);
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = 'es-MX';
      utterance.rate = Number(settings.value.voiceRate) || 1.0;
      utterance.pitch = Number(settings.value.voicePitch) || 1.0;
      utterance.volume = clampVolume(settings.value.voiceVolume ?? 0.9, 0.9);
      const voice = pickSpanishVoice();
      if (voice) utterance.voice = voice;

      let settled = false;
      const settle = () => { if (settled) return; settled = true; finishSpeech(); };
      utterance.onend = settle;
      utterance.onerror = (event) => {
        if (event?.error && event.error !== 'interrupted' && event.error !== 'canceled') {
          console.warn('No se pudo reproducir la voz:', event.error);
        }
        settle();
      };

      isSpeaking.value = true;
      speechWatchdogTimer = setTimeout(() => {
        try { window.speechSynthesis.cancel(); } catch {}
        settle();
      }, SPEECH_WATCHDOG_MS);
      try {
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.warn('No se pudo iniciar la voz:', e);
        settle();
      }
    };
    const speakCallAnnouncement = (deviceId, callerName, isEmergency) => {
      if (!('speechSynthesis' in window) || !settings.value.voiceEnabled) return;
      enqueueSpeech({ deviceId, callerName, isEmergency });
    };

    // Recordatorio de pendientes: mientras haya llamados sin finalizar,
    // avisa cada intervalo configurable (voz o sonido según configuración).
    const lastPendingReminderAt = ref(0);
    const checkPendingReminder = () => {
      const active = allCalls.value.length;
      if (!settings.value.pendingReminderEnabled || active === 0) {
        lastPendingReminderAt.value = 0;
        return;
      }
      const intervalMs = (Number(settings.value.pendingReminderIntervalS) || 120) * 1000;
      const now = Date.now();
      if (!lastPendingReminderAt.value) { lastPendingReminderAt.value = now; return; }
      if (now - lastPendingReminderAt.value < intervalMs) return;
      lastPendingReminderAt.value = now;
      const hasEmergency = allCalls.value.some(c => c.isEmergency);
      if (settings.value.voiceEnabled && ('speechSynthesis' in window)) {
        enqueueSpeech({ pendingReminder: true });
      } else {
        playAlertSound(hasEmergency);
      }
    };

    const triggerAlert = (deviceId, isEmergency, callType) => {
      // Guarda dura: ningún llamado especial (type3..type6) puede generar
      // sonido ni anuncio de voz en esta pantalla, sin importar la ruta.
      if (SPECIAL_CALL_TYPES.includes(callType)) return;
      newCallIds.value = [...newCallIds.value, deviceId];
      setTimeout(() => { newCallIds.value = newCallIds.value.filter(id => id !== deviceId); }, 5000);
      if (settings.value.voiceEnabled) {
        speakCallAnnouncement(deviceId, getDeviceName(deviceId), isEmergency);
      } else {
        playAlertSound(isEmergency);
      }
    };

    // ── Datos en vivo ──
    const applySnapshot = (nextCalls) => {
      // La pantalla de sala solo muestra normal/emergencia: los especiales
      // (type3..type6) viven en su pestaña y no deben disparar alertas ni
      // contaminar el contador de consecutivo del llamador.
      const relevant = nextCalls.filter(c => !SPECIAL_CALL_TYPES.includes(c.call_type));
      if (hasLoadedInitialSnapshot) {
        for (const call of relevant) {
          if (!call.active) continue;
          const prevCons = knownCons.get(call.deviceId);
          if (prevCons === undefined) {
            triggerAlert(call.deviceId, call.call_type === 'emergency', call.call_type);
          } else if (call.cons > prevCons) {
            triggerAlert(call.deviceId, call.call_type === 'emergency', call.call_type);
          }
        }
      }
      knownCons.clear();
      for (const call of relevant) if (call.active) knownCons.set(call.deviceId, call.cons);
      calls.value = relevant;
      hasLoadedInitialSnapshot = true;
    };

    const applyCallState = (state) => {
      // Un mismo llamador puede tener varios especiales: su cierre solo debe
      // retirar la fila (dispositivo, tipo) sin tocar la llamada normal.
      const idx = calls.value.findIndex(
        c => c.deviceId === state.deviceId && c.call_type === state.call_type
      );
      if (SPECIAL_CALL_TYPES.includes(state.call_type)) {
        if (state.active) {
          if (idx >= 0) calls.value[idx] = state; else calls.value.push(state);
        } else if (idx >= 0) {
          calls.value.splice(idx, 1);
        }
        return;
      }
      if (state.active) {
        const prevCons = knownCons.get(state.deviceId);
        if (idx >= 0) calls.value[idx] = state; else calls.value.push(state);
        if (hasLoadedInitialSnapshot && (prevCons === undefined || state.cons > prevCons)) {
          triggerAlert(state.deviceId, state.call_type === 'emergency', state.call_type);
        }
        knownCons.set(state.deviceId, state.cons);
      } else {
        if (idx >= 0) calls.value.splice(idx, 1);
        knownCons.delete(state.deviceId);
      }
    };

    let socket;
    let clockTimer, timerTimer, rotationTimer;

    onMounted(async () => {
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      updateViewport();
      window.addEventListener('resize', updateViewport);

      try {
        const [callsRes, devicesRes, settingsRes] = await Promise.all([
          fetch('/calls/active').then(r => r.json()),
          fetch('/devices').then(r => r.json()),
          fetch('/location-settings').then(r => r.json()),
        ]);
        devices.value = devicesRes.items || [];
        settings.value = settingsRes;
        applyAudioSources();
        applySnapshot(callsRes.items || []);
      } catch (e) { /* se recupera con los eventos del socket */ }

      socket = io();
      socket.on('active_calls', (list) => applySnapshot(list));
      socket.on('call_state', (state) => applyCallState(state));
      socket.on('device_list', (list) => { devices.value = list; });
      socket.on('device_registered', (device) => {
        const idx = devices.value.findIndex(d => d.deviceId === device.deviceId);
        if (idx >= 0) devices.value[idx] = device; else devices.value.push(device);
      });
      socket.on('location_settings', (next) => {
        const voiceWasEnabled = settings.value.voiceEnabled;
        settings.value = next;
        applyAudioSources();
        if (voiceWasEnabled && !next.voiceEnabled) cancelSpeech();
      });

      clockTimer = setInterval(() => { currentTime.value = new Date(); }, 1000);
      timerTimer = setInterval(() => {
        for (const call of calls.value) {
          if (!call.active) continue;
          callTimers[call.deviceId] = msToClock(Date.now() - call.startedAtMs);
        }
        checkPendingReminder();
      }, 1000);
      rotationTimer = setInterval(() => {
        if (allCalls.value.length > maxVisibleCalls.value) {
          rotationIndex.value = (rotationIndex.value + 1) % allCalls.value.length;
        }
      }, ROTATION_INTERVAL_MS);
    });

    onUnmounted(() => {
      window.removeEventListener('resize', updateViewport);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.removeEventListener?.('voiceschanged', loadVoices);
      }
      cancelSpeech();
      if (socket) socket.disconnect();
      clearInterval(clockTimer);
      clearInterval(timerTimer);
      clearInterval(rotationTimer);
    });

    return {
      maxVisibleCalls, allCalls, visibleCalls, settings, cssVariables, screenTransform, newCallIds,
      formattedCurrentTime, formatCallTime, locationIconSvg, accountSvg,
      alertSound, alertSoundBackup1, alertSoundBackup2,
      emergencySound, emergencySoundBackup1, emergencySoundBackup2,
    };
  }
}).mount('#app');
</script>
</body>
</html>
